<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Админка — Voskresenskiy Design</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login -->
  <section class="login" data-login hidden>
    <form class="login__card" data-login-form>
      <span class="logo" aria-hidden="true"></span>
      <h1>Вход в админку</h1>
      <p class="muted">Voskresenskiy Design</p>
      <label class="fld"><span>Email</span><input type="email" name="email" autocomplete="username" required></label>
      <label class="fld"><span>Пароль</span><input type="password" name="password" autocomplete="current-password" required></label>
      <p class="login__err" data-login-err hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Войти</button>
    </form>
  </section>

  <!-- App -->
  <div class="app" data-app hidden>
    <aside class="side">
      <a class="side__brand" href="https://voskresenskiydesign.uz/" target="_blank" rel="noopener"><span class="logo" aria-hidden="true"></span><span><b>Voskresenskiy</b><small>Админ-панель</small></span></a>
      <nav class="side__nav" data-nav>
        <button data-tab="works" class="is-active"><i>▦</i>Работы</button>
        <button data-tab="hero"><i>◐</i>Главный экран</button>
        <button data-tab="about"><i>✎</i>Обо мне</button>
        <button data-tab="skills"><i>◆</i>Софт</button>
        <button data-tab="roles"><i>⋔</i>Роли</button>
        <button data-tab="clients"><i>◎</i>Клиенты</button>
        <button data-tab="categories"><i>☰</i>Категории</button>
        <button data-tab="contacts"><i>✆</i>Контакты</button>
        <button data-tab="settings"><i>⚙</i>Настройки</button>
      </nav>
      <div class="side__foot">
        <p class="mode" data-mode></p>
        <button class="btn btn--ghost btn--sm" data-logout hidden>Выйти</button>
      </div>
    </aside>

    <main class="main">
      <header class="top">
        <div>
          <h1 class="top__title" data-title>Работы</h1>
          <p class="top__sub muted" data-subtitle></p>
        </div>
        <div class="top__actions">
          <span class="dirty" data-dirty hidden>Есть несохранённые изменения</span>
          <a class="btn btn--ghost" href="https://voskresenskiydesign.uz/" target="_blank" rel="noopener">Открыть сайт ↗</a>
          <button class="btn btn--primary" data-save disabled>Сохранить <kbd>Ctrl S</kbd></button>
        </div>
      </header>
      <div class="banner" data-banner hidden></div>
      <div class="panel" data-panel></div>
    </main>
  </div>

  <!-- Drawer -->
  <div class="drawer" data-drawer hidden>
    <div class="drawer__scrim" data-drawer-close></div>
    <div class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
      <header class="drawer__head">
        <h2 id="drawer-title" data-drawer-title>Работа</h2>
        <button class="icon-btn" data-drawer-close aria-label="Закрыть">✕</button>
      </header>
      <div class="drawer__body" data-drawer-body></div>
    </div>
  </div>

  <div class="toasts" data-toasts aria-live="polite"></div>
  <input type="file" data-file hidden>

  <script src="config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>
